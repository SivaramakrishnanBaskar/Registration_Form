<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #7e22ce 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(126, 34, 206, 0.2) 0%, transparent 70%);
            border-radius: 50%;
            top: -100px;
            right: -100px;
            animation: float 6s ease-in-out infinite;
        }

        body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(42, 82, 152, 0.2) 0%, transparent 70%);
            border-radius: 50%;
            bottom: -100px;
            left: -100px;
            animation: float 8s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(30px); }
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3), 0 0 40px rgba(126, 34, 206, 0.1);
            padding: 60px 50px;
            max-width: 480px;
            width: 100%;
            animation: slideIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
            z-index: 10;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-50px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .form-header {
            text-align: center;
            margin-bottom: 45px;
        }

        .icon-wrapper {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #7e22ce 0%, #2a5298 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            box-shadow: 0 10px 30px rgba(126, 34, 206, 0.3);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .form-header h1 {
            font-size: 36px;
            color: #1a1a2e;
            margin-bottom: 8px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .form-header p {
            color: #666;
            font-size: 15px;
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        .form-group {
            margin-bottom: 28px;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #1a1a2e;
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            font-size: 18px;
            color: #999;
            transition: color 0.3s ease;
            pointer-events: none;
            z-index: 1;
        }

        input {
            width: 100%;
            padding: 14px 16px 14px 45px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: inherit;
            background: #f8f9fa;
        }

        input::placeholder {
            color: #ccc;
        }

        input:focus {
            outline: none;
            border-color: #7e22ce;
            background: white;
            box-shadow: 0 0 0 4px rgba(126, 34, 206, 0.1);
        }

        input.error {
            border-color: #ef4444;
            background: #fef2f2;
        }

        input.error:focus {
            box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.1);
        }

        input.success {
            border-color: #10b981;
            background: #f0fdf4;
        }

        input.success:focus {
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
        }

        .error-message {
            color: #ef4444;
            font-size: 12px;
            margin-top: 6px;
            display: none;
            font-weight: 500;
        }

        .error-message.show {
            display: block;
            animation: slideDown 0.2s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-5px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .password-strength {
            margin-top: 12px;
            height: 6px;
            background-color: #e0e0e0;
            border-radius: 3px;
            overflow: hidden;
        }

        .password-strength-bar {
            height: 100%;
            width: 0%;
            transition: width 0.3s ease, background-color 0.3s ease;
            border-radius: 3px;
            box-shadow: 0 0 10px currentColor;
        }

        .password-strength-text {
            font-size: 12px;
            margin-top: 6px;
            display: none;
            font-weight: 600;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #7e22ce 0%, #2a5298 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-top: 15px;
            box-shadow: 0 10px 30px rgba(126, 34, 206, 0.3);
            position: relative;
            overflow: hidden;
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            transition: left 0.3s ease;
            z-index: 0;
        }

        .submit-btn:hover::before {
            left: 100%;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(126, 34, 206, 0.4);
        }

        .submit-btn:active {
            transform: translateY(-1px);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            margin-top: 20px;
            padding: 16px 20px;
            border-radius: 12px;
            text-align: center;
            display: none;
            animation: messageIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-weight: 600;
            font-size: 14px;
        }

        @keyframes messageIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .success-message {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.1), rgba(5, 150, 105, 0.1));
            color: #047857;
            border: 2px solid #10b981;
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.2);
        }

        .failure-message {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.1), rgba(220, 38, 38, 0.1));
            color: #991b1b;
            border: 2px solid #ef4444;
            box-shadow: 0 5px 15px rgba(239, 68, 68, 0.2);
        }

        .message.show {
            display: block;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }

        .spinner {
            border: 3px solid rgba(126, 34, 206, 0.1);
            border-top: 3px solid #7e22ce;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .footer-text {
            text-align: center;
            color: #999;
            font-size: 12px;
            margin-top: 35px;
            font-weight: 500;
        }

        .divider {
            text-align: center;
            color: #ddd;
            margin: 25px 0;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 40px 25px;
            }

            .form-header h1 {
                font-size: 28px;
            }

            .form-header p {
                font-size: 14px;
            }

            .icon-wrapper {
                width: 60px;
                height: 60px;
                font-size: 30px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-header">
            <div class="icon-wrapper">👤</div>
            <h1>Create Account</h1>
            <p>Join us today and get started</p>
        </div>

        <form id="registrationForm">
            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-wrapper">
                    <span class="input-icon">👤</span>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Choose your username"
                        required
                    >
                </div>
                <div class="error-message" id="usernameError"></div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <span class="input-icon">🔒</span>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a strong password"
                        required
                    >
                </div>
                <div class="password-strength">
                    <div class="password-strength-bar" id="strengthBar"></div>
                </div>
                <div class="password-strength-text" id="strengthText"></div>
                <div class="error-message" id="passwordError"></div>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                <span class="btn-text">Register Now</span>
            </button>

            <div class="loading" id="loading">
                <div class="spinner"></div>
            </div>

            <div class="message" id="message"></div>
        </form>

        <div class="footer-text">
            ✓ Your data will be securely stored
        </div>
    </div>

    <script>
        const form = document.getElementById('registrationForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const submitBtn = document.getElementById('submitBtn');
        const messageDiv = document.getElementById('message');
        const loading = document.getElementById('loading');
        const strengthBar = document.getElementById('strengthBar');
        const strengthText = document.getElementById('strengthText');

        // Replace with your Google Apps Script URL
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwIcIXO3zfrcrLpJv4sX1ioIoSKQBs8QUTuHUknBMWtYeBHh-aA0oCXlS7gJCxTMzXOzA/exec';

        // Validate username
        function validateUsername(username) {
            if (username.length < 3) {
                return 'Username must be at least 3 characters long';
            }
            if (username.length > 20) {
                return 'Username must not exceed 20 characters';
            }
            if (!/^[a-zA-Z0-9_]+$/.test(username)) {
                return 'Username can only contain letters, numbers, and underscores';
            }
            return '';
        }

        // Validate password
        function validatePassword(password) {
            if (password.length < 6) {
                return 'Password must be at least 6 characters long';
            }
            if (password.length > 50) {
                return 'Password must not exceed 50 characters';
            }
            return '';
        }

        // Check password strength
        function checkPasswordStrength(password) {
            let strength = 0;
            if (password.length >= 8) strength++;
            if (password.length >= 12) strength++;
            if (/[a-z]/.test(password)) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^a-zA-Z0-9]/.test(password)) strength++;

            const strengthLevels = ['Weak', 'Fair', 'Good', 'Strong', 'Very Strong', 'Excellent'];
            const colors = ['#e74c3c', '#e67e22', '#f39c12', '#27ae60', '#16a085', '#2980b9'];

            strengthBar.style.width = (strength / 6 * 100) + '%';
            strengthBar.style.backgroundColor = colors[strength - 1] || '#e74c3c';
            strengthText.textContent = 'Strength: ' + strengthLevels[strength - 1];
            strengthText.style.color = colors[strength - 1];
            strengthText.style.display = 'block';
        }

        // Input event listeners
        usernameInput.addEventListener('input', function() {
            const error = validateUsername(this.value);
            const errorDiv = document.getElementById('usernameError');

            if (error) {
                this.classList.add('error');
                this.classList.remove('success');
                errorDiv.textContent = error;
                errorDiv.classList.add('show');
            } else {
                this.classList.remove('error');
                this.classList.add('success');
                errorDiv.classList.remove('show');
            }
        });

        passwordInput.addEventListener('input', function() {
            const error = validatePassword(this.value);
            const errorDiv = document.getElementById('passwordError');

            if (error) {
                this.classList.add('error');
                this.classList.remove('success');
                errorDiv.textContent = error;
                errorDiv.classList.add('show');
                strengthBar.style.width = '0%';
                strengthText.style.display = 'none';
            } else {
                this.classList.remove('error');
                this.classList.add('success');
                errorDiv.classList.remove('show');
                checkPasswordStrength(this.value);
            }
        });

        // Form submission
        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            // Final validation
            const usernameError = validateUsername(username);
            const passwordError = validatePassword(password);

            if (usernameError || passwordError) {
                showMessage('Please fix the errors above', false);
                return;
            }

            // Show loading
            submitBtn.disabled = true;
            loading.style.display = 'block';
            messageDiv.classList.remove('show');

            try {
                const response = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        username: username,
                        password: password,
                        timestamp: new Date().toLocaleString()
                    })
                });

                const result = await response.json();

                if (result.success) {
                    showMessage('✓ Registration Successful! Your data has been saved.', true);
                    form.reset();
                    usernameInput.classList.remove('success', 'error');
                    passwordInput.classList.remove('success', 'error');
                    strengthBar.style.width = '0%';
                    strengthText.style.display = 'none';
                } else {
                    showMessage('✗ Registration Failed: ' + (result.message || 'Please try again'), false);
                }
            } catch (error) {
                console.error('Error:', error);
                showMessage('✗ Registration Failed: ' + error.message, false);
            } finally {
                submitBtn.disabled = false;
                loading.style.display = 'none';
            }
        });

        function showMessage(text, isSuccess) {
            messageDiv.textContent = text;
            messageDiv.className = 'message show ' + (isSuccess ? 'success-message' : 'failure-message');
        }
    </script>
</body>
</html>
